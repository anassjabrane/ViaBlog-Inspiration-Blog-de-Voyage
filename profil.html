<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Profil Utilisateur</title>
  <script src="https://cdn.tailwindcss.com"></script>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" >
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
 <header class="bg-white shadow-md p-4 flex justify-between items-center
               md:ml-20">
    <h1 class="text-xl font-bold text-gray-800">Explore Beyond the Limits</h1>
    <button class="text-gray-600">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <!-- Profile Section -->
  <section class="max-w-md mx-auto mt-6 bg-white rounded-lg shadow-lg p-6 text-center">
    <img src="https://i.pravatar.cc/150?img=12" alt="Avatar"
         class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-teal-500" >
    <h2 class="text-2xl font-semibold text-gray-800">Anass jabrane</h2>
    <p class="text-gray-500 mb-4">Exploring World</p>
    <button class="bg-teal-500 text-white px-4 py-2 rounded-full hover:bg-teal-600 transition">
      Follow
    </button>

    <!-- Stats -->
    <div class="flex justify-around mt-6 text-gray-700">
      <div>
        <p class="text-lg font-bold">30</p>
        <p class="text-sm">Articles</p>
      </div>
      <div>
        <p class="text-lg font-bold">5.6k</p>
        <p class="text-sm">Followers</p>
      </div>
      <div>
        <p class="text-lg font-bold">1.2k</p>
        <p class="text-sm">Following</p>
      </div>
    </div>

    <!-- Bio -->
    

    <!-- Articles -->
    <div class="mt-6">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Published Articles</h3>
      <div class="space-y-4">
        <div class="bg-gray-100 p-3 rounded-lg flex items-center">
          <img src="images/pexels-athena-2996210.jpg" alt=""
               class="w-16 h-16 rounded-lg mr-4" >
          <div>
            <p class="font-semibold text-gray-700">Tranquil Echo</p>
            <p class="text-xs text-gray-500">43m ago</p>
          </div>
        </div>
        <div class="bg-gray-100 p-3 rounded-lg flex items-center">
          <img src="images/pexels-njeromin-35223500.jpg" alt=""
               class="w-16 h-16 rounded-lg mr-4" >
          <div>
            <p class="font-semibold text-gray-700">Ascent</p>
            <p class="text-xs text-gray-500">1h 25m ago</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 md:top-0 md:bottom-0 md:w-20 md:h-screen">
    <div class="flex md:flex-col items-center justify-around md:justify-start gap-4
             p-3 bg-gray-300 rounded-xl md:rounded-none h-full">
      <a href="home.html"
      aria-label="Profil"
      class="hover:bg-green-400 rounded-xl h-9 w-11 flex justify-center items-center">
      <i class="fa-solid fa-house"></i>
   </a>
      <button class="hover:bg-green-400 rounded-xl h-9 w-11 flex justify-center items-center"><i class="fas fa-map-marker-alt"></i></button>
      <button class="hover:bg-green-400 rounded-xl h-9 w-11 flex justify-center items-center"><i class="fa-regular fa-heart"></i></button>
      <button class="bg-green-400 rounded-xl h-9 w-11 flex justify-center items-center"><i class="fa-solid fa-user"></i></button>
    </div>

</div>
  </nav>


</body>
</html>
