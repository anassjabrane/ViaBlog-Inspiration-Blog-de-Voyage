<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories Instagram Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body class="bg-white text-gray-800 pb-20">

<!-- HEADER -->
<header class="flex justify-between items-center px-4 py-3">
  <h1 class="text-xl font-bold">Top Stories</h1>
  <button id="openForm" class="bg-green-500 text-white px-3 py-1 rounded">
    + Story
  </button>
</header>

<!-- STORIES -->
<section class="py-2">
  <div id="storiesContainer" class="flex gap-4 px-4 overflow-x-auto">
    <!-- Les stories s'ajoutent ici -->
  </div>
</section>

<!-- FORM (HIDDEN) -->
<section id="storyForm" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">
  <div class="bg-white p-4 rounded-xl w-80 space-y-3">
    <h2 class="font-bold text-lg">Add Story</h2>

    <input id="storyName" type="text" placeholder="Your name" class="w-full border p-2 rounded">
    <input id="storyImage" type="file" accept="image/*" class="w-full">

    <div class="flex justify-end gap-2">
      <button id="closeForm" class="px-3 py-1 border rounded">Cancel</button>
      <button id="addStory" class="px-3 py-1 bg-green-500 text-white rounded">Add</button>
    </div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const storiesContainer = document.getElementById("storiesContainer");
  const openForm = document.getElementById("openForm");
  const closeForm = document.getElementById("closeForm");
  const form = document.getElementById("storyForm");
  const addStoryBtn = document.getElementById("addStory");

  const nameInput = document.getElementById("storyName");
  const imageInput = document.getElementById("storyImage");

  // Tableau initial des stories (exemple)
  let stories = [
    { name: "Anass", image: "images/louvermuseum.jpg" },
    { name: "Sara", image: "images/viator2.jpg" },
    { name: "Ali", image: "images/pexels-njeromin-35223500.jpg" }
  ];

  function renderStories() {
    storiesContainer.innerHTML = "";
    stories.forEach(story => {
      const div = document.createElement("div");
      div.className = "flex flex-col items-center gap-1 flex-shrink-0";
      div.innerHTML = `
        <div class="w-20 h-20 rounded-full border-4 border-pink-500 p-1">
          <img src="${story.image}" class="w-full h-full rounded-full object-cover">
        </div>
        <p class="text-xs truncate w-20 text-center">${story.name}</p>
      `;
      storiesContainer.appendChild(div);
    });
  }

  // Affichage initial des stories
  renderStories();

  // Ouvrir/fermer le formulaire
  openForm.onclick = () => form.classList.remove("hidden");
  closeForm.onclick = () => form.classList.add("hidden");

  // Ajouter une story
  addStoryBtn.onclick = () => {
    const name = nameInput.value;
    const file = imageInput.files[0];

    if (!name || !file) {
      alert("Fill all fields");
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      // Ajouter au début du tableau
      stories.unshift({ name, image: reader.result });
      renderStories();
      form.classList.add("hidden");
      nameInput.value = "";
      imageInput.value = "";
    };
    reader.readAsDataURL(file);
  };
});
</script>

</body>
</html>
